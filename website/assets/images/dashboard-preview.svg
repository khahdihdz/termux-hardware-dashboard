<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Termux Hardware Dashboard bilingual Android preview</title>
<desc id="desc">Illustrative Android phone showing the Vietnamese and English Termux hardware dashboard with CPU, GPU, RAM, storage, battery, sensors and network readings.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071521"/><stop offset=".55" stop-color="#12384b"/><stop offset="1" stop-color="#06111c"/></linearGradient>
 <linearGradient id="glow" x2="1" y2="1"><stop stop-color="#00e5ff"/><stop offset="1" stop-color="#00b88a"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="720" rx="32" fill="url(#bg)"/>
<circle cx="280" cy="330" r="220" fill="#00c9e8" opacity=".12" filter="url(#shadow)"/>
<circle cx="980" cy="330" r="220" fill="#00d6a0" opacity=".10" filter="url(#shadow)"/>
<g font-family="system-ui, sans-serif" fill="#eafaff">
 <text x="72" y="112" font-size="25" letter-spacing="5" fill="#61eaff">ANDROID · TERMUX · NO ROOT</text>
 <text x="72" y="190" font-size="58" font-weight="800">Termux Hardware</text>
 <text x="72" y="255" font-size="58" font-weight="800" fill="#21d9e8">Dashboard</text>
 <text x="72" y="310" font-size="24" fill="#b6d9e6">Theo dõi phần cứng Android / Monitor Android hardware</text>
 <g transform="translate(72 370)">
  <rect width="450" height="76" rx="15" fill="#102c3c" stroke="#10cce1" stroke-width="2"/>
  <text x="24" y="31" font-size="22" font-weight="700">CPU · GPU · RAM · Storage</text>
  <text x="24" y="58" font-size="18" fill="#9bd6e3">Bộ xử lý · Bộ nhớ · Lưu trữ</text>
  <rect y="96" width="450" height="76" rx="15" fill="#102c3c" stroke="#10cce1" stroke-width="2"/>
  <text x="24" y="127" font-size="22" font-weight="700">Battery · Sensors · Network</text>
  <text x="24" y="154" font-size="18" fill="#9bd6e3">Pin · Cảm biến · Kết nối mạng</text>
  <rect y="192" width="450" height="76" rx="15" fill="#102c3c" stroke="#10cce1" stroke-width="2"/>
  <text x="24" y="223" font-size="22" font-weight="700">Vietnamese / English</text>
  <text x="24" y="250" font-size="18" fill="#9bd6e3">Giao diện song ngữ · Bilingual UI</text>
 </g>
</g>
<g transform="translate(680 30) rotate(4 210 330)">
 <rect x="20" y="0" width="430" height="660" rx="58" fill="#02070c" stroke="#6d8796" stroke-width="7"/>
 <rect x="42" y="28" width="386" height="604" rx="38" fill="#030b10" stroke="#1b3e4d" stroke-width="2"/>
 <rect x="175" y="14" width="120" height="10" rx="5" fill="#253d49"/>
 <g font-family="ui-monospace, monospace">
  <text x="68" y="82" font-size="19" fill="#21d9e8">TERMUX HARDWARE DASHBOARD</text>
  <text x="68" y="112" font-size="14" fill="#8caebb">VI / EN · Android system monitor</text>
  <path d="M65 132H405" stroke="#0b8296" stroke-width="2"/>
  <text x="68" y="171" font-size="18" fill="#4ef0b0">DEVICE / THIẾT BỊ</text>
  <text x="68" y="204" font-size="16" fill="#d8f5fa">Android       15</text>
  <text x="68" y="235" font-size="16" fill="#d8f5fa">Architecture  arm64-v8a</text>
  <text x="68" y="266" font-size="16" fill="#d8f5fa">Root          No / Không</text>
  <path d="M65 288H405" stroke="#0b8296" stroke-width="2"/>
  <text x="68" y="326" font-size="18" fill="#4ef0b0">HARDWARE / PHẦN CỨNG</text>
  <text x="68" y="362" font-size="16" fill="#d8f5fa">CPU  ▰▰▰▰▱  78%</text>
  <text x="68" y="397" font-size="16" fill="#d8f5fa">RAM  ▰▰▰▱▱  62%</text>
  <text x="68" y="432" font-size="16" fill="#d8f5fa">GPU  ▰▰▰▱▱  Active</text>
  <text x="68" y="467" font-size="16" fill="#d8f5fa">Battery       85%</text>
  <text x="68" y="502" font-size="16" fill="#d8f5fa">Sensors       Available</text>
  <text x="68" y="537" font-size="16" fill="#d8f5fa">Network       Connected</text>
  <rect x="64" y="565" width="340" height="42" rx="8" fill="#06303a" stroke="#12cde0"/>
